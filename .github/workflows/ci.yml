name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Lint, Test & Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Pinned here rather than via a packageManager field in package.json:
      # that field makes pnpm self-provision the same version on the production
      # server, which runs Node 20 and cannot execute pnpm 11 (needs >= 22.13).
      # CI runs Node 22, so it can use pnpm 11 — it needs the built-in `sbom`
      # command below, which does not exist in pnpm 10. The server keeps its own
      # pnpm 10.29.3; both read the same lockfile (9.0) with --frozen-lockfile.
      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.1.1

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Security audit (pnpm)
        run: pnpm audit --audit-level=high
        continue-on-error: true

      - name: Security audit (Snyk)
        uses: snyk/actions/node@master
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

      - name: TypeScript type-check
        run: pnpm exec tsc --noEmit

      - name: Lint
        run: pnpm lint

      - name: Check i18n
        run: pnpm check:i18n

      - name: Run tests with coverage
        run: pnpm test:coverage
        env:
          SKIP_ENV_VALIDATION: true

      - name: Build
        run: pnpm build
        env:
          SKIP_ENV_VALIDATION: true

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14

      # pnpm ships its own SBOM generator; the CycloneDX npm CLI cannot be used
      # here because it shells out to `npm ls --all`, which pnpm rejects.
      - name: Generate SBOM
        run: pnpm sbom --sbom-format cyclonedx > sbom.json

      - name: Upload SBOM
        uses: actions/upload-artifact@v7
        with:
          name: sbom
          path: sbom.json
          retention-days: 30
